# Android CI: compile the app, then run the unit tests.
# Speed practices:
# - setup-java manages the Gradle dependency and wrapper caches plus the JDK
#   installation itself, keyed off the build files, so repeat runs only
#   rebuild what changed.
# - The Android build cache and the native-compile cache are restored and
#   re-saved through the Actions cache; the restore/save split keeps a failed
#   run from polluting the cache.
# - Superseded pushes to the same ref cancel older in-progress runs.
# - The Gradle wrapper pins the distribution, so CI uses the same build
#   revision every time and the cache stays valid.
# - No Android SDK setup action: the plugin provisions its own toolchain
#   area, and the runner's pre-installed SDK is used when present.
name: Android CI

on:
  push:
    branches:
      - Wyatt-AI-CI-Setup
      - main
  pull_request:
    branches:
      - Wyatt-AI-CI-Setup
      - main

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up the JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Restore the Android build and native-compile caches
        id: gradle-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/android
            ~/.gradle/native
          key: ${{ runner.os }}-android-ci-buildcache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-android-ci-buildcache-

      - name: Compile the app and run the unit tests
        run: |
          chmod +x CampBNB/gradlew
          cd CampBNB
          ./gradlew -p app test --build-cache

      - name: Save the Android build and native-compile caches
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/android
            ~/.gradle/native
          key: ${{ steps.gradle-cache-restore.outputs.cache-primary-key }}
